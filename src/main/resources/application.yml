spring:
  application:
    name: emprendetech
  profiles:
    # En el MVP se arranca en "dev" por defecto (datos semilla + tokens de demostración).
    # En producción: SPRING_PROFILES_ACTIVE=prod y JWT_SECRET obligatorio.
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/emprendetech}
    username: ${DB_USER:emprendetech}
    password: ${DB_PASSWORD:emprendetech}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # el esquema lo gestiona Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 300ms           # la caché no debe volver lenta la API si Redis falla
      connect-timeout: 300ms

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      enabled: false           # Redis es una optimización: su caída no debe sacar la instancia del balanceador

emprendetech:
  seguridad:
    jwt-secret: ${JWT_SECRET:}      # mínimo 32 caracteres (HS256)
  catalogo:
    cache:
      ttl-segundos: 60
